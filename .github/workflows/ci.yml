name: Autogenerate API Docs for Flask app

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main


jobs:
  get_pdoc_docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [main] # ${{matrix.service}}
        python-version: ["3.12"] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pdoc
        run: uv run pdoc ${{ matrix.service }}.py -o ${{ matrix.service }}-docs

  deploy:
    needs: get_pdoc_docs
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # default for Github Workflow token is none so we cannot write to github pages without it
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{matrix.service}}-pdoc-report.html
          path: _site
      - uses: actions/download-artifact@v8
        with:
          name: ${{matrix.service}}-pdoc-report.html
          path: _site
      - run: |
          cat > _site/index.html <<'EOF'
          <h1>Bandit reports</h1>
          <p><a href="tasks-api-3.12-bandit-report.html">tasks-api</a></p>
          <p><a href="${{matrix.service}}-doc.html">title-normalizer</a></p>
          EOF
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5